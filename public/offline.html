<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e9" />
    <title>接続できません | KCS Navi</title>
    <style>
      :root {
        font-family: 'Noto Sans JP', sans-serif;
        color: #4b2d22;
        background: #fff6ea;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 20px;
        box-sizing: border-box;
        background: white;
        border: 1px solid #ead6c5;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.5;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.8;
        color: #7d5b49;
      }
      button,
      a {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        padding: 12px 16px;
        border: 0;
        border-radius: 20px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #4b2d22;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: #f3a366;
      }
      a {
        background: #fff6ea;
        border: 1px solid #ead6c5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>オフラインです</h1>
      <p>
        このページは保存されていないため、電波の届く場所で再読み込みしてください。<br />
        一度開いたページと会場マップはオフラインでも閲覧できます。
      </p>
      <button type="button" onclick="location.reload()">もう一度読み込む</button>
      <a href="/">会場マップへ</a>
    </main>
  </body>
</html>
